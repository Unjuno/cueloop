name: tests

on:
  pull_request:
  push:
    branches: [main]
  # The macOS adapter compile is flaky on shared ARM runners (queued jobs get
  # cancelled at the infra cap). Run it on demand instead of every push; the
  # unit job already covers lint/tests/replay/wheel on every PR and push.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e . pytest ruff
      - name: Lint
        run: |
          ruff check src tests scripts/*.py
          ruff format --check src tests scripts/*.py
      - name: Run the test suite
        run: python -m pytest -q
      - name: Replay the deterministic sync fixture
        run: |
          python -m cueloop.sync.cli \
            --events experiments/sync-smoke.jsonl \
            --cue-style bare \
            --report /tmp/sync-report.json \
            --log /tmp/sync-log.jsonl
      - name: Build distribution wheel
        run: python -m pip wheel --no-deps . --wheel-dir /tmp/wheels

  macos-adapter:
    # Only on explicit manual dispatch; push/PR CI must stay green regardless
    # of macOS ARM runner capacity (see run 45418637065).
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    # macOS ARM runners are frequently capacity-constrained and this job has
    # been cancelled at the 15-min infra cap while still QUEUED (no steps ran,
    # 2026-11-23 run 45195738266). The compile is verified locally and the
    # unit job already covers lint/tests/replay/wheel, so treat this as a
    # best-effort extra check: an infra cancel must not turn main red.
    continue-on-error: true
    # Note: `continue-on-error` does NOT suppress a `timeout-minutes` cancel
    # (run 45418637065 was still failure with the macos-adapter job cancelled
    # at 16m while QUEUED). Raise the cap so a slow runner can still start.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - name: Compile macOS microphone adapter
        run: |
          mkdir -p .build
          swiftc tools/macos_speech_events.swift -o .build/macos-speech-events \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker tools/macos_speech_events.Info.plist
          .build/macos-speech-events --help
      - name: Compile macOS file recognizer
        run: |
          swiftc tools/file_asr.swift -o .build/lux-file-asr \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker tools/file_asr.Info.plist
          .build/lux-file-asr 2>&1 | head -1 || true
