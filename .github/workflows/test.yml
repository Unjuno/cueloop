name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e pytest ruff
      - name: Lint
        run: ruff check src tests scripts/*.py
      - name: Run the test suite
        run: python -m pytest -q
      - name: Replay the deterministic sync fixture
        run: |
          python -m cueloop.sync.cli \
            --events experiments/sync-smoke.jsonl \
            --report /tmp/sync-report.json \
            --log /tmp/sync-log.jsonl
      - name: Build distribution wheel
        run: python -m pip wheel --no-deps . --wheel-dir /tmp/wheels

  macos-adapter:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile macOS microphone adapter
        run: |
          mkdir -p .build
          swiftc tools/macos_speech_events.swift -o .build/macos-speech-events \
            -Xlinker -sectcreate -Xlinker __TEXT -Xlinker __info_plist \
            -Xlinker tools/macos_speech_events.Info.plist
          .build/macos-speech-events --help
