[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cueloop"
version = "0.1.0"
description = "A minimal-intervention CLI for human-first reasoning sessions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "All rights reserved" }
authors = [{ name = "Unjuno" }]
dependencies = []

[project.scripts]
cueloop = "cueloop.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
